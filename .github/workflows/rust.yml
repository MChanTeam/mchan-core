name: Rust

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install SQLite formatter
        run: python -m pip install --disable-pip-version-check "syntaqlite==0.7.1"
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check SQLite formatting
        run: |
          sql_files=()
          while IFS= read -r file; do
            case "$file" in
              migrations/0005_add_poster_ids.sql) ;;
              *) sql_files+=("$file") ;;
            esac
          done < <(git ls-files 'migrations/*.sql')
          # syntaqlite 0.7.1 drops ALTER TABLE ADD COLUMN constraints.
          syntaqlite fmt --check "${sql_files[@]}"
      - name: Check release consistency
        run: make release-check
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Build Docker image
        run: docker build --tag mchan:ci .
      - name: Deploy development image
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        env:
          DEPLOY_KEY: ${{ secrets.MCHAN_DEPLOY_KEY }}
          VPS_HOST: ${{ vars.MCHAN_VPS_HOST }}
          VPS_USER: ${{ vars.MCHAN_VPS_USER }}
          VPS_KNOWN_HOSTS: ${{ vars.MCHAN_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          key_file="$RUNNER_TEMP/mchan_ci_deploy"
          known_hosts_file="$RUNNER_TEMP/mchan_known_hosts"

          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$known_hosts_file"

          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT

          docker save mchan:ci |
            gzip -1 |
            ssh -T \
              -F /dev/null \
              -i "$key_file" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$known_hosts_file" \
              "$VPS_USER@$VPS_HOST"
