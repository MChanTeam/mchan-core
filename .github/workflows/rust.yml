name: Rust

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install SQLite formatter
        run: python -m pip install --disable-pip-version-check "syntaqlite==0.7.1"
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check SQLite formatting
        run: syntaqlite fmt --check "**/*.sql"
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Build Docker image
        run: docker build --tag mchan:ci .
