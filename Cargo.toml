[package]
name = "MChan"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.16.0"
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["fs"] }
sqlx = {
version = "0.8",
default-features = false,
features = [
"runtime-tokio",
"sqlite",
"migrate",
"macros",
]
}
