<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{% endblock %}</title>
    <link href="/static/style.css" rel="stylesheet" />
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/favicon-16x16.png" />
    <link rel="shortcut icon" href="/static/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/static/favicon/site.webmanifest" />
    <meta property="og:site_name" content="MChan" />
    <meta name="theme-color" content="#fff7d6" />
    {% block embed %}
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MChan" />
    <meta property="og:description" content="Anonymous boards for Malaysian higher-education communities." />
    <meta name="description" content="Anonymous boards for Malaysian higher-education communities." />
    <meta name="twitter:card" content="summary" />
    {% endblock %}
    {% block head %}{% endblock %}
  </head>

  <body>
    {% block body %}{% endblock %}
    <footer class="site-footer">
      <a href="/rules">Rules</a>
      <span class="nav-sep">/</span>
      <a href="/privacy">Privacy</a>
      <span class="nav-sep">/</span>
      <a href="/changelog">Changelog</a>
    </footer>
    {% block scripts %}{% endblock %}
  </body>
</html>
